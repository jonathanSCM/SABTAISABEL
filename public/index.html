    (opts.accionLabel ? '<button class="btn btn--ghost btn--sm alert__action" data-accion="'+opts.accionTipo+'" data-valor="'+esc(opts.accionValor||"")+'">'+opts.accionLabel+"</button>" : "")+
  "</div>";
}
function respEtapaTxt(p){ return p.responsable ? p.responsable+(p.etapa ? " · "+p.etapa : "") : ""; }
function fila(p){
  return '<button class="row'+(p.id === state.recien ? " is-new" : "")+'" data-open="'+p.id+'">'+
    '<span class="row__main"><span class="row__t">'+esc(p.cliente)+"</span>"+
    '<span class="row__s">'+esc(p.producto)+" · <span class=\"num\">"+nf(p.cantidad)+"</span> und"+(p.responsable?" · "+esc(respEtapaTxt(p)):"")+"</span></span>"+

/* ---- Pedidos ---- */
function filtrar(){
  const f = state.filtros, t = f.texto.trim().toLowerCase();
  return pedidos.filter(p => {
    if(f.estado !== "Todos" && estadoVis(p) !== f.estado) return false;
    if(f.cliente !== "Todos" && p.cliente !== f.cliente) return false;
    const n = diasDesdeHoy(p.compromiso);
    if(f.rango === "Hoy" && n !== 0) return false;
    if(f.rango === "Esta semana" && !(n >= 0 && n <= 6)) return false;
    if(f.rango === "15 días" && !(n >= 0 && n <= 15)) return false;
    if(f.rango === "Vencidas" && n >= 0) return false;
    if(t && !(p.cliente+" "+p.producto+" "+p.id+" "+p.responsable).toLowerCase().includes(t)) return false;
    return true;
  }).sort((a,b) => {
    if(a.id === state.recien) return -1; if(b.id === state.recien) return 1;
    const d = ORDEN_ESTADO[estadoVis(a)] - ORDEN_ESTADO[estadoVis(b)];
    if(d !== 0) return d;
    return a.estado === "Entregado" ? b.compromiso.localeCompare(a.compromiso) : a.compromiso.localeCompare(b.compromiso);
  });
}

/* ---- Calendario ---- */
function vCalendario(){
  const m = state.mes, y = m.getFullYear(), mo = m.getMonth();
  const primero = new Date(y,mo,1);
  const offset = (primero.getDay()+6)%7;
  const inicio = addDays(primero,-offset);
  const celdas = [];
  for(let i=0;i<42;i++){
    const d = addDays(inicio,i), f = iso(d), c = cargaDe(f);
    const ps = pedidosDe(f);
    celdas.push(
      '<button class="day'+(d.getMonth()!==mo?" day--out":"")+(f===iso(hoy())?" day--today":"")+'" data-day="'+f+'">'+
        '<span class="day__h"><span class="day__n">'+d.getDate()+"</span>"+
          (c.n ? '<span class="day__cnt num">'+c.n+"</span><span class=\"day__dot lv-"+c.nivel+'"></span>' : "")+
        "</span>"+
        ps.slice(0,3).map(p => '<span class="pill'+(c.nivel==="alta"?" pill--alta":"")+'">'+esc(p.cliente)+" · "+nf(p.cantidad)+"</span>").join("")+
        (ps.length > 3 ? '<span class="day__more">+'+(ps.length-3)+" más</span>" : "")+
      "</button>");
  }
  const mesesTot = pedidos.filter(p => activo(p) && p.compromiso.startsWith(y+"-"+String(mo+1).padStart(2,"0"))).length;

  /* carga por responsable esta semana: cuántos pedidos activos con entrega en los próximos 7 días
     (o ya atrasados) tiene cada persona — para detectar sobrecarga antes de que llegue la fecha */
  const NIVEL_RESP_TXT = { alta:"Sobrecargado", media:"Carga normal", baja:"Disponible", cero:"Disponible" };
  const nivelResp = n => n >= 3 ? "alta" : n >= 1 ? "media" : "cero";
  const cargaResp = RESPONSABLES.map(nombre => {
    const n = pedidos.filter(p => p.responsable === nombre && activo(p) && (atrasado(p) || diasDesdeHoy(p.compromiso) <= 6)).length;
    return { nombre, n, nivel: nivelResp(n) };
  });

  /* en móvil, una lista de los próximos días en vez de la grilla mensual completa: menos denso, más fácil de leer con el pulgar */
  const listaDias = [];
  for(let i=0;i<21;i++){
    const f = isoOff(i), d = parse(f), c = cargaDe(f), ps = pedidosDe(f);
    listaDias.push('<button class="cal-list__day'+(i===0?" cal-list__day--today":"")+'" data-day="'+f+'">'+
      '<span class="cal-list__d"><span class="cal-list__n">'+d.getDate()+'</span><span class="cal-list__dow">'+DOW[(d.getDay()+6)%7]+"</span></span>"+
      '<span class="cal-list__info"><span class="cal-list__cnt">'+(c.n ? c.n+" pedido"+(c.n===1?"":"s") : "Sin entregas")+"</span>"+
        (ps.length ? '<span class="cal-list__names">'+ps.slice(0,3).map(p=>esc(p.cliente)).join(" · ")+"</span>" : "")+
      "</span>"+
      (c.n ? '<span class="cal-list__dot lv-'+c.nivel+'"></span>' : "")+
    "</button>");
  }

  return '<section class="card">'+
    '<div class="calhead">'+
      '<button class="btn btn--sm" data-mes="-1" aria-label="Mes anterior">←</button>'+
      "<h2>"+MESES[mo]+" "+y+"</h2>"+
      '<button class="btn btn--sm" data-mes="1" aria-label="Mes siguiente">→</button>'+
      '<button class="btn btn--sm btn--ghost" data-mes="0">Hoy</button>'+
      '<span class="calhead__count muted"><b class="num">'+mesesTot+"</b> entregas este mes</span>"+
      '<button class="btn btn--ghost btn--sm" id="btnExportCalendario" style="margin-left:auto">Exportar CSV</button>'+
    "</div>"+
    '<div class="cal">'+DOW.map(d => '<div class="cal__dow">'+d+"</div>").join("")+celdas.join("")+"</div>"+
    '<div class="cal-list">'+listaDias.join("")+"</div>"+
    '<div class="card__body legend" style="border-top:1px solid var(--line)">'+
      '<span><i style="--c:var(--line-2)"></i>Carga baja</span>'+
      '<span><i style="--c:var(--gold)"></i>Carga media</span>'+
      '<span><i style="--c:var(--crit)"></i>Carga alta</span>'+
      '<span class="muted">Toca un día para ver sus pedidos</span>'+
    "</div>"+
  "</section>"+

  '<section class="card">'+
    '<div class="card__head"><h2>Carga por responsable</h2><span class="muted">pedidos activos vencidos o que vencen esta semana</span></div>'+
    '<div class="carga-resp">'+cargaResp.map(c =>
      '<div class="carga-resp__row"><span class="carga-resp__nombre">'+esc(c.nombre)+"</span>"+
        '<span class="badge s-'+(c.nivel==="alta"?"atrasado":c.nivel==="media"?"produccion":"terminado")+'">'+NIVEL_RESP_TXT[c.nivel]+"</span>"+
        '<span class="carga-resp__n">'+c.n+" pedido"+(c.n===1?"":"s")+"</span>"+
      "</div>"
    ).join("")+"</div>"+
  "</section>";
}

async function aprobarCotizacion(q){
  try{
    const { cotizacion, pedido } = await api("/cotizaciones/"+q.id+"/aprobar", { method:"POST" });

    pedidos.push(pedido);

    go("pedidos");
    setTimeout(()=>abrirPedido(pedido.id), 80);
  } catch(e){ toast(e.message); }
}

  qs("#q-addColor").onclick = () => { d.colores.push({color:"Nuevo",cant:1}); renderColores(); updateSheet(); };

  qs("#q-cancel").onclick = () => { state.cotiz.modo = "lista"; render(); };
  qs("#q-save").onclick = async () => {
    if(!d.cliente.trim() || !d.prenda.trim()){ toast("Completá al menos el cliente y la prenda."); return; }
    const btn = qs("#q-save"); btn.disabled = true;
    try{
      if(d.id){
        const actualizada = await api("/cotizaciones/"+d.id, { method:"PUT", body:JSON.stringify(d) });
        const idx = cotizaciones.findIndex(x => x.id === d.id);
        if(idx >= 0) cotizaciones[idx] = actualizada; else cotizaciones.push(actualizada);
        toast(actualizada.id+" guardada");
        abrirCotiz("ver", actualizada.id);
      } else {

    } catch(e){ toast(e.message); } finally { btn.disabled = false; }
  };
  page.querySelector('[data-back="cotizaciones"]').onclick = () => { state.cotiz.modo = "lista"; render(); };

  renderCurva(); renderColores(); renderGroups(); updateSheet();
}

/* ---- exportación a CSV: respeta siempre los filtros/búsqueda ya aplicados en pantalla ---- */
function toCSV(headers, rows){
  const escCSV = v => { const s = String(v==null?"":v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lineas = [headers.map(escCSV).join(",")];
  rows.forEach(r => lineas.push(headers.map(h => escCSV(r[h])).join(",")));
  return lineas.join("\r\n");
}
function descargarCSV(filename, headers, rows){
  const csv = "﻿" + toCSV(headers, rows); // BOM: para que Excel abra bien los acentos
  const blob = new Blob([csv], { type:"text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("Descargando "+filename);
}
function pedidoCSVRow(p){
  const tipos = [...new Set(p.produccion.map(t=>t.tipo))];
  return {
    "Código":p.id, "Cliente":p.cliente, "Prenda":p.producto, "Cantidad":p.cantidad,
    "Estado":estadoVis(p), "Responsable":p.responsable, "Etapa actual":p.etapa,
    "Tipo de ejecución": tipos.length>1 ? "Mixto" : (tipos[0]||"Interno"),
    "Registro":p.registro, "Solicitada":p.solicitada, "Comprometida":p.compromiso, "Observaciones":p.obs
  };
}
const PEDIDO_CSV_HEADERS = ["Código","Cliente","Prenda","Cantidad","Estado","Responsable","Etapa actual","Tipo de ejecución","Registro","Solicitada","Comprometida","Observaciones"];
function exportarPedidosCSV(){
  descargarCSV("pedidos.csv", PEDIDO_CSV_HEADERS, filtrar().map(pedidoCSVRow));
}
function exportarCotizacionesCSV(){
  const t = (state.qTexto||"").trim().toLowerCase();
  const lista = [...cotizaciones].filter(q => !t || (q.cliente+" "+q.prenda+" "+q.id).toLowerCase().includes(t));
  const headers = ["Código","Cliente","Prenda","Estado","Fecha","Vigencia (días)","Unidades","Total"];
  descargarCSV("cotizaciones.csv", headers, lista.map(q => ({
    "Código":q.id, "Cliente":q.cliente, "Prenda":q.prenda, "Estado":q.estado,
    "Fecha":q.fecha, "Vigencia (días)":q.vigencia, "Unidades":qUnidades(q), "Total":qTotal(q).toFixed(2)
  })));
}
function exportarSemanaCSV(){
  const modo = state.semanaModo || "estado";
  const grupos = modo === "responsable"
    ? (function(){ const act = pedidos.filter(activo); const nombres = [...new Set(act.map(p=>p.responsable||"Sin asignar"))];
        return nombres.map(n => ({ grupo:n, ps: act.filter(p => (p.responsable||"Sin asignar")===n) })); })()
    : (function(){ const act = pedidos.filter(activo);
        return [
          { grupo:"Hoy", ps: act.filter(p => !atrasado(p) && p.estado !== "Terminado" && (diasDesdeHoy(p.compromiso)===0 || p.estado==="En producción")) },
          { grupo:"Próximos", ps: act.filter(p => !atrasado(p) && p.estado==="Preparación" && diasDesdeHoy(p.compromiso)>0 && diasDesdeHoy(p.compromiso)<=7) },
          { grupo:"Atrasados", ps: pedidos.filter(atrasado) },
          { grupo:"Terminados", ps: pedidos.filter(p => p.estado==="Terminado") }
        ]; })();
  const headers = ["Grupo", ...PEDIDO_CSV_HEADERS];
  const rows = [];
  grupos.forEach(g => g.ps.forEach(p => rows.push({ "Grupo":g.grupo, ...pedidoCSVRow(p) })));
  descargarCSV("esta-semana.csv", headers, rows);
}
function exportarCalendarioCSV(){
  const headers = ["Fecha","Pedidos comprometidos","Clientes"];
  const rows = [];
  for(let i=0;i<21;i++){
    const f = isoOff(i), c = cargaDe(f), ps = pedidosDe(f);
    rows.push({ "Fecha":f, "Pedidos comprometidos":c.n, "Clientes": ps.map(p=>p.cliente).join(" · ") });
  }
  descargarCSV("calendario.csv", headers, rows);
}

    if(tipo === "abrir-pedido") abrirPedido(valor);
    else if(tipo === "iniciar-produccion"){ const p = pedidos.find(x=>x.id===valor); if(p) cambiarEstado(p, "En producción"); }
    else if(tipo === "ver-dia") abrirDia(valor);
    else if(tipo === "ver-semana") go("semana");
    else if(tipo === "ver-cotizacion") abrirCotiz("ver", valor);
  });
}

}

  $("#drawerBody").querySelectorAll("[data-tab]").forEach(t => t.onclick = () => {

  $("#drawerBody").querySelectorAll("[data-chk]").forEach(b => b.onclick = () => toggleChecklist(p, b.dataset.chk, b.dataset.hecho === "true"));

  $("#drawerBody").querySelectorAll("[data-muestra-aprobar]").forEach(b => b.onclick = () => actualizarEstadoMuestra(p, b.dataset.muestraAprobar, "Aprobada"));
  $("#drawerBody").querySelectorAll("[data-muestra-rechazar]").forEach(b => b.onclick = () => actualizarEstadoMuestra(p, b.dataset.muestraRechazar, "Rechazada"));
  $("#drawerBody").querySelectorAll("[data-prod]").forEach(b => b.onclick = () => abrirModalProduccion(p.id, b.dataset.prod));
  const btnGuia = $("#btnGenerarGuia"); if(btnGuia) btnGuia.onclick = () => generarGuia(p);
  const btnEntregado = $("#btnMarcarEntregado"); if(btnEntregado) btnEntregado.onclick = () => cambiarEstado(p, "Entregado");

  abrirDrawer();
}
async function toggleChecklist(p, slug, hechoActual){
  try{
    const actualizado = await api("/pedidos/"+p.id+"/checklist/"+slug, { method:"PATCH", body: JSON.stringify({ hecho: !hechoActual }) });
    Object.assign(p, actualizado);
    render(); abrirPedido(p.id, "preparacion");
  } catch(e){ toast(e.message); }
}
async function actualizarEstadoMuestra(p, version, estado){
  try{
    const actualizado = await api("/pedidos/"+p.id+"/muestras/"+version+"/estado", { method:"PATCH", body: JSON.stringify({ estado }) });
    Object.assign(p, actualizado);
    toast("Muestra "+version+" → "+estado);
    render(); abrirPedido(p.id, "muestra");
  } catch(e){ toast(e.message); }
}
async function cambiarEstado(p, nuevo){
  if(p.estado === nuevo) return;
  try{
    const actualizado = await api("/pedidos/"+p.id+"/estado", { method:"PATCH", body:JSON.stringify({ estado:nuevo }) });
    Object.assign(p, actualizado);
    toast(p.id+" · "+p.cliente+" ahora está en "+nuevo);
    render(); abrirPedido(p.id);
  } catch(e){ toast(e.message); }
}

function abrirDia(f){
  const ps = pedidosDe(f).sort((a,b) => a.cliente.localeCompare(b.cliente));
  const c = cargaDe(f);
  const unid = ps.reduce((s,p) => s+p.cantidad,0);
  $("#drawerKicker").textContent = "Día de entrega";
  $("#drawerTitle").textContent = fechaLarga(f).replace(/^./, s => s.toUpperCase());
  $("#drawerBody").innerHTML =
    '<div class="notice notice--'+(c.nivel==="cero"?"baja":c.nivel)+'"><h3>'+NIVEL_TXT[c.nivel]+"</h3>"+
      c.n+" pedido"+(c.n===1?"":"s")+" comprometido"+(c.n===1?"":"s")+(unid ? ' · <span class="num">'+nf(unid)+"</span> unidades" : "")+"</div>"+
    (ps.length ? '<div class="rows" style="border:1px solid var(--line);border-radius:var(--r)">'+ps.map(fila).join("")+"</div>"
               : '<div class="empty">No hay pedidos comprometidos para esta fecha.</div>')+
    '<button class="btn btn--primary" id="newHere">+ Crear pedido para esta fecha</button>';
  $("#drawerBody").querySelectorAll("[data-open]").forEach(el => el.onclick = () => abrirPedido(el.dataset.open));
  $("#newHere").onclick = () => { cerrarDrawer(); abrirModal(f); };
  abrirDrawer();
}

/* ---- modal: nueva versión de muestra ---- */
const modalMuestra = $("#modalMuestra"), formMuestra = $("#formMuestra");
formMuestra._fotos = [];
function abrirModalMuestra(pedidoId){
  formMuestra.reset();
  formMuestra.dataset.pedidoId = pedidoId;
  formMuestra._fotos = [];
  $("#ms-fotos-preview").innerHTML = "";
  scrim.dataset.open = "true"; modalMuestra.dataset.open = "true";
}
function cerrarModalMuestra(){ modalMuestra.dataset.open = "false"; if(!otroOverlayAbierto("modalMuestra")) scrim.dataset.open = "false"; }
$("#modalMuestraClose").onclick = cerrarModalMuestra;
$("#btnMuestraCancel").onclick = cerrarModalMuestra;
$("#ms-fotos-btn").onclick = () => $("#ms-fotos").click();
$("#ms-fotos").onchange = async e => {
  const files = [...e.target.files].slice(0,6);
  const leer = f => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });
  formMuestra._fotos = await Promise.all(files.map(leer));
  $("#ms-fotos-preview").innerHTML = formMuestra._fotos.map(f => '<img src="'+f+'">').join("");
};
formMuestra.addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#btnMuestraSave"); btn.disabled = true;
  try{
    const pedidoId = formMuestra.dataset.pedidoId;
    const p = pedidos.find(x => x.id === pedidoId);
    const actualizado = await api("/pedidos/"+pedidoId+"/muestras", { method:"POST", body: JSON.stringify({
      responsable: $("#ms-responsable").value.trim(),
      cambiosSolicitados: $("#ms-cambios").value.trim(),
      comentariosCliente: $("#ms-comentarios").value.trim(),
      fotos: formMuestra._fotos
    }) });
    Object.assign(p, actualizado);
    cerrarModalMuestra();
    toast("Muestra registrada.");
    render(); abrirPedido(pedidoId, "muestra");
  } catch(err){ toast(err.message); } finally { btn.disabled = false; }
});

/* ---- modal: editar una etapa de producción (interno/tercerizado, estado, fechas) ---- */
const modalProduccion = $("#modalProduccion"), formProduccion = $("#formProduccion");
function abrirModalProduccion(pedidoId, etapaSlug){
  const p = pedidos.find(x => x.id === pedidoId);
  const t = p.produccion.find(x => x.etapa === etapaSlug);
  formProduccion.reset();
  formProduccion.dataset.pedidoId = pedidoId;
  formProduccion.dataset.etapa = etapaSlug;
  $("#modalProduccionTitle").textContent = t.label;
  $("#pr-tipo").value = t.tipo;
  $("#pr-estado").value = t.estado;
  $("#pr-responsable-label").textContent = t.tipo === "Tercerizado" ? "Proveedor" : "Responsable";
  $("#pr-responsable").value = t.responsable || "";
  $("#pr-fecha-prevista").value = t.fechaPrevista || "";
  $("#pr-fecha-real").value = t.fechaReal || "";
  scrim.dataset.open = "true"; modalProduccion.dataset.open = "true";
}
function cerrarModalProduccion(){ modalProduccion.dataset.open = "false"; if(!otroOverlayAbierto("modalProduccion")) scrim.dataset.open = "false"; }
$("#modalProduccionClose").onclick = cerrarModalProduccion;
$("#btnProduccionCancel").onclick = cerrarModalProduccion;
$("#pr-tipo").onchange = () => { $("#pr-responsable-label").textContent = $("#pr-tipo").value === "Tercerizado" ? "Proveedor" : "Responsable"; };
formProduccion.addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#btnProduccionSave"); btn.disabled = true;
  try{
    const pedidoId = formProduccion.dataset.pedidoId, etapaSlug = formProduccion.dataset.etapa;
    const p = pedidos.find(x => x.id === pedidoId);
    const actualizado = await api("/pedidos/"+pedidoId+"/produccion/"+etapaSlug, { method:"PATCH", body: JSON.stringify({
      tipo: $("#pr-tipo").value, estado: $("#pr-estado").value, responsable: $("#pr-responsable").value.trim(),
      fechaPrevista: $("#pr-fecha-prevista").value, fechaReal: $("#pr-fecha-real").value
    }) });
    Object.assign(p, actualizado);
    cerrarModalProduccion();
    toast("Etapa actualizada.");
    render(); abrirPedido(pedidoId, "produccion");
  } catch(err){ toast(err.message); } finally { btn.disabled = false; }
});

/* ---- hoja de acciones (bottom sheet) para cambiar estado ---- */
const actsheet = $("#actsheet");
function abrirActionSheet(titulo, opciones, nota){
  $("#actsheetTitle").textContent = titulo;
  $("#actsheetBody").innerHTML =
    (nota ? '<div class="actsheet__nota">'+nota+"</div>" : "")+
    opciones.map(o =>
      '<button class="actsheet__opt" data-val="'+esc(o.val)+'" aria-selected="'+(o.selected?"true":"false")+'"'+
        (o.disabled ? " disabled" : "")+">"+(o.badge||"")+"<span>"+esc(o.label)+"</span>"+
        (o.disabled && !o.selected ? '<svg class="ico actsheet__lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>' : "")+
      "</button>"
  ).join("");
  scrim.dataset.open = "true"; actsheet.dataset.open = "true";
  return new Promise(resolve => {
    $("#actsheetBody").querySelectorAll("[data-val]:not([disabled])").forEach(b => b.onclick = () => { cerrarActionSheet(); resolve(b.dataset.val); });
    $("#actsheetCancel").onclick = () => { cerrarActionSheet(); resolve(null); };
  });
}
function cerrarActionSheet(){ actsheet.dataset.open = "false"; if(!otroOverlayAbierto("actsheet")) scrim.dataset.open = "false"; }

function chequearCarga(){
  const f = $("#f-compromiso").value;
  const box = $("#loadCheck"), btn = $("#btnSave");
  if(!f){ box.innerHTML = ""; btn.textContent = "Registrar pedido"; return; }
  const c = cargaDe(f), ps = pedidosDe(f);
  const nivel = c.nivel === "cero" ? "baja" : c.nivel;
  const detalle = ps.slice(0,5).map(p => "<li>"+esc(p.cliente)+" · "+esc(p.producto)+" · "+nf(p.cantidad)+" und</li>").join("");
  box.innerHTML = '<div class="notice notice--'+nivel+'">'+
    "<h3>"+(c.nivel === "alta" ? "Esta fecha ya tiene carga alta" : NIVEL_TXT[c.nivel]+" para el "+fechaCorta(f))+"</h3>"+
    "Pedidos existentes para el "+fechaLarga(f)+": <b>"+c.n+"</b>"+
    (ps.length ? "<ul>"+detalle+(ps.length>5 ? "<li>+"+(ps.length-5)+" más</li>" : "")+"</ul>" : "")+
    (c.nivel === "alta" ? "<div style=\"margin-top:7px\"><b>¿Deseás continuar con esta fecha?</b> Comprometer un pedido más puede poner en riesgo las entregas del día.</div>" : "")+
  "</div>";
  if(c.nivel === "alta" && !state.confirmAlta){ btn.textContent = "Registrar de todos modos"; btn.classList.add("btn--danger"); btn.classList.remove("btn--primary"); }
  else { btn.textContent = "Registrar pedido"; btn.classList.add("btn--primary"); btn.classList.remove("btn--danger"); }
}
$("#f-compromiso").addEventListener("change", () => { state.confirmAlta = false; chequearCarga(); });
$("#f-compromiso").addEventListener("input", () => { state.confirmAlta = false; chequearCarga(); });

form.addEventListener("submit", async e => {
  e.preventDefault();
  const cliente = $("#f-cliente").value.trim();
  const producto = $("#f-producto").value.trim();
  const cantidad = Number($("#f-cantidad").value);
  const compromiso = $("#f-compromiso").value;
  if(!cliente || !producto || !cantidad || !compromiso){ toast("Completá cliente, prenda, cantidad y fecha comprometida."); return; }
  const btnSave = $("#btnSave"); btnSave.disabled = true;
  try{
    const p = await crearPedido({
      cliente, producto, cantidad, compromiso, solicitada:$("#f-solicitada").value || compromiso,
      prioridad:$("#f-prioridad").value, responsable:$("#f-responsable").value.trim(),
      etapa:$("#f-etapa").value, obs:$("#f-obs").value.trim()
    });
    cerrarModal();
    refrescarDatalists();
    state.mes = new Date(parse(compromiso).getFullYear(), parse(compromiso).getMonth(), 1);
    state.filtros = { estado:"Todos", cliente:"Todos", rango:"Todas", texto:"" };
    state.recien = p.id;
    go("pedidos");
    const filaEl = page.querySelector('[data-open="'+p.id+'"]');
    if(filaEl) filaEl.scrollIntoView({ behavior:"smooth", block:"center" });
    toast(p.id+" registrado · entrega "+fechaLarga(compromiso));
    abrirPedido(p.id);
  } catch(err){ toast(err.message); } finally { btnSave.disabled = false; }
});

/* ---- toast ---- */
let tt;
function toast(msg){ const el = $("#toast"); el.textContent = msg; el.dataset.open = "true"; clearTimeout(tt); tt = setTimeout(() => el.dataset.open = "false", 3200); }

/* ---- tema claro / oscuro ---- */
const THEME_KEY = "santa-isabel-theme";
const ICON_SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/></svg>';
function efectiveTheme(){
  const attr = document.documentElement.getAttribute("data-theme");
  if(attr === "light" || attr === "dark") return attr;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function pintarBotonTema(){
  const eff = efectiveTheme();
  const btn = $("#themeToggle");
  btn.innerHTML = eff === "dark" ? ICON_SUN : ICON_MOON;
  btn.setAttribute("aria-label", eff === "dark" ? "Cambiar a tema claro" : "Cambiar a tema oscuro");
  btn.title = eff === "dark" ? "Cambiar a tema claro" : "Cambiar a tema oscuro";
}
function aplicarTema(t){
  if(t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  pintarBotonTema();
}
$("#themeToggle").onclick = () => {
  const next = efectiveTheme() === "dark" ? "light" : "dark";
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  aplicarTema(next);
};
try{
  const savedTheme = localStorage.getItem(THEME_KEY);
  if(savedTheme) aplicarTema(savedTheme); else pintarBotonTema();
}catch(e){ pintarBotonTema(); }

/* ---- datalists ---- */
function refrescarDatalists(){
  $("#clientes").innerHTML = [...new Set(pedidos.map(p => p.cliente))].sort().map(c => '<option value="'+esc(c)+'">').join("");
}
$("#productos").innerHTML = PRODUCTOS.map(c => '<option value="'+esc(c)+'">').join("");
$("#responsables").innerHTML = RESPONSABLES.map(c => '<option value="'+esc(c)+'">').join("");
$("#f-etapa").insertAdjacentHTML("beforeend", ETAPAS.map(e => '<option value="'+esc(e)+'">'+esc(e)+"</option>").join(""));

async function boot(){
  try{
    usuarioActual = await api("/auth/me");
  } catch(e){
    location.href = "/login.html";
    return;
  }
  $("#userNombre").textContent = usuarioActual.nombre;
  $("#userEmail").textContent = usuarioActual.email;

  const [pd, ct] = await Promise.all([ api("/pedidos"), api("/cotizaciones") ]);
  pedidos = pd; cotizaciones = ct;
  refrescarDatalists();
  render();
  $("#bootOverlay").remove();
}
boot();
